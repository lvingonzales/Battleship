<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./main.js" defer></script>
    <title>Battleship</title>
</head>
<body>
    <div id="content">
        <!-- Home Screen Layout -->
        <div id="title">Battleship</div>
        <div id="menu">
            <button>Start Game</button>
            <div id="player-choice">
                <div class="choice">
                    <button class="choice-btn"> &#9656; Choose</button>
                    <ul class="dropdown">
                        <li>Player</li>
                        <li>Computer</li>
                        <li>Choose</li>
                    </ul>
                </div>
                <p>VS</p>
                <div class="choice">
                    <button class="choice-btn"> &#9656; Choose</button>
                    <ul class="dropdown hidden">
                        <li>Player</li>
                        <li>Computer</li>
                        <li>Choose</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <footer><span>Liam Gonzales</span></footer>
</body>
</html>
